name: Publish to NPM

on:
  push:
    branches:
      - main
  # Allow manually triggering the workflow
  workflow_dispatch:

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        # Run the build script defined in package.json (usually runs 'expo-module build')
        run: npm run build

      - name: Publish to NPM
        # Only publish if the version in package.json doesn't exist on npm yet
        run: npx can-npm-publish --verbose && npm publish --access public || echo "Version already exists, skipping publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
