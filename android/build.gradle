apply plugin: 'com.android.library'

group = 'expo.modules.facerecognition'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.facerecognition"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
    // Mediapipe Face Detection
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'

    // LiteRT (formerly TensorFlow Lite) for Embeddings & Spoof Detection
    def ai_edge = "1.4.1"
    implementation "com.google.ai.edge.litert:litert:${ai_edge}"
    implementation "com.google.ai.edge.litert:litert-gpu:${ai_edge}"
    implementation "com.google.ai.edge.litert:litert-gpu-api:${ai_edge}"
    implementation "com.google.ai.edge.litert:litert-support:${ai_edge}"

    // CameraX for real-time detection (1.3.4 is more stable than 1.5.x)
    def camerax_version = "1.5.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
}

// Task to download models at build time
def models = [
    "blaze_face_short_range.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/blaze_face_short_range.tflite",
//    "facenet.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/facenet.tflite",
    "facenet_512.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/facenet_512.tflite",
    "specs_classifier.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/specs_classifier.tflite",
    "spoof_model_scale_2_7.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/spoof_model_scale_2_7.tflite",
    "spoof_model_scale_4_0.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/spoof_model_scale_4_0.tflite",
//    "mobilefacenet.tflite": "https://github.com/rdnf-magiba/expo-face-recognition/releases/download/models/mobilefacenet.tflite",
]

tasks.register('downloadModels') {
    doLast {
        def assetsDir = new File(project.projectDir, "src/main/assets")
        if (!assetsDir.exists()) {
            assetsDir.mkdirs()
        }

        models.each { name, url ->
            def file = new File(assetsDir, name)
            if (!file.exists()) {
                println "Downloading ${name} from ${url}..."
                try {
                    new URL(url).withInputStream { i -> file.withOutputStream { it << i } }
                    println "Successfully downloaded ${name}"
                } catch (Exception e) {
                    println "Failed to download ${name}: ${e.message}"
                    // Fail build if model download fails? Maybe better to warn for now or throw exception.
                    // throw new GradleException("Could not download model: ${name}")
                }
            } else {
                println "Model ${name} already exists."
            }
        }
    }
}

// Hook into the build process
preBuild.dependsOn downloadModels